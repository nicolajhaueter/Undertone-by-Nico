services:
  postgres:
    image: postgres:17-alpine
    container_name: undertone-postgres
    environment:
      POSTGRES_DB: undertone
      POSTGRES_USER: undertone
      POSTGRES_PASSWORD: undertone
    ports:
      - "5432:5432"
    volumes:
      - undertone-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undertone -d undertone"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  undertone-postgres:
