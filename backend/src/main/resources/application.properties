spring.application.name=backend

# PostgreSQL from docker-compose.yml at the repository root (docker compose up -d).
spring.datasource.url=${UNDERTONE_DB_URL:jdbc:postgresql://localhost:5432/undertone}
spring.datasource.username=${UNDERTONE_DB_USER:undertone}
spring.datasource.password=${UNDERTONE_DB_PASSWORD:undertone}

# Image files live outside the repository; the database stores only metadata.
undertone.images.dir=${UNDERTONE_IMAGES_DIR:${user.home}/Undertone-data/images}

spring.mvc.problemdetails.enabled=true
